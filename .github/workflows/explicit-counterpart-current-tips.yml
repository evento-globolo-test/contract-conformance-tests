  push:
    branches: [main]
    paths: ['.github/workflows/explicit-counterpart-current-tips.yml']
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  current-production-contracts:
    uses: zed-pkg-test/.github/.github/workflows/reusable-explicit-counterpart-current-tips.yml@28da20bc67b963c084b6498102a153179b68f6c0
    with:
      test_owner: evento-globolo-test
      test_owner_id: '313177352'
      production_owner: evento-globolo
      production_owner_id: '313128930'
      governance_repository: evento-globolo-test/.github
    secrets:
      read_token: ${{ secrets.TEST_FLEET_READ_TOKEN || secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
